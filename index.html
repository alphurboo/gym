<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gym Log</title>

  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymLog" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/dumbbell.png" />

  <style>
    :root {
      --bg: #0b0f17;
      --card: #151d2a;
      --inner: #0b0f17;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #243044;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* 適配 iPhone 16 Pro 寬度與 Safe Area */
    body {
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 20px) 12px;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* 頂部導航 Tab */
    .top-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 9px 2px; font-size: 0.76rem; font-weight: 700; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; white-space: nowrap; }
    .nav-btn.active { background: var(--accent); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px; margin-bottom: 12px; }
    .card-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; }

    /* 部位標籤：英文 5 等分 一行過排版 */
    .chip-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
    .chip { font-size: 0.68rem; font-weight: 700; padding: 7px 1px; border-radius: 8px; border: 1px solid var(--border); background: var(--inner); color: var(--text-muted); text-align: center; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-height: 135px; overflow-y: auto; margin-bottom: 8px; }
    .ex-btn { font-size: 0.72rem; padding: 8px 3px; text-align: center; border-radius: 8px; border: 1px solid var(--border); background: var(--inner); color: var(--text); cursor: pointer; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ex-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }
    .btn-custom-ex { grid-column: span 3; background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--accent); color: var(--accent); font-size: 0.72rem; padding: 6px; border-radius: 8px; cursor: pointer; font-weight: 700; text-align: center; margin-top: 2px; }

    /* 上次紀錄看板 */
    .prev-box { background: var(--inner); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; font-size: 0.75rem; line-height: 1.4; margin-bottom: 11px; }

    /* 6個輸入框 (Set Rows) */
    .sets-header { display: grid; grid-template-columns: 42px 1fr 1fr 28px; gap: 6px; font-size: 0.68rem; color: var(--text-muted); font-weight: 700; text-align: center; margin-bottom: 4px; }
    .set-row { display: grid; grid-template-columns: 42px 1fr 1fr 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
    .set-tag { font-size: 0.72rem; font-weight: 700; color: var(--accent); text-align: center; background: var(--inner); padding: 7px 0; border-radius: 6px; border: 1px solid var(--border); }
    
    .num-input { width: 100%; background: var(--inner); border: 1px solid var(--border); color: #fff; font-size: 0.95rem; font-weight: 700; text-align: center; padding: 7px 2px; border-radius: 8px; outline: none; font-family: monospace; }
    .num-input:focus { border-color: var(--accent); }
    .num-input::placeholder { color: rgba(255, 255, 255, 0.28); font-weight: 600; }
    
    .btn-del-set { background: transparent; border: none; color: var(--danger); font-size: 1rem; cursor: pointer; }

    .btn-add-set { width: 100%; background: var(--inner); border: 1px dashed var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; margin-top: 2px; margin-bottom: 9px; }
    .btn-add-set:active { background: var(--accent-dim); }

    .btn-save { width: 100%; background: var(--accent); color: #000; font-weight: 800; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.92rem; transition: all 0.2s; }
    .btn-save:active { transform: scale(0.98); }
    .btn-save.editing-mode { background: var(--warning); color: #000; }

    /* 列表與分析 */
    .log-item { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s; }
    .log-item:active { border-color: var(--accent); }
    .log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .log-title { font-weight: 700; font-size: 0.86rem; color: var(--accent); }
    .log-body { font-family: monospace; font-size: 0.8rem; color: var(--text); }
    
    .stat-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
    .stat-box { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 9px; text-align: center; }
    .stat-val { font-size: 1.15rem; font-weight: 800; color: var(--accent); font-family: monospace; }
    .stat-lbl { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }

    .history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem; }
    .history-row:last-child { border-bottom: none; }

    /* 底部 Toast 提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: #000;
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.8rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Modal 彈窗 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 16px; z-index: 100; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; width: 100%; max-width: 380px; }
    .btn-action { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.72rem; padding: 5px 9px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 頂部 3 個主要選擇 -->
  <nav class="top-nav">
    <button class="nav-btn active" id="tabBtn1" onclick="switchTab(1)">記錄今日</button>
    <button class="nav-btn" id="tabBtn2" onclick="switchTab(2)">歷史紀錄</button>
    <button class="nav-btn" id="tabBtn3" onclick="switchTab(3)">分析數據</button>
  </nav>

  <!-- ================= TAB 1: 記錄今日 ================= -->
  <section id="tab1">
    <div class="card">
      <div class="card-title">
        <span>🏋️ 訓練動作</span>
        <input type="date" id="gymDate" style="background:transparent; border:none; color:var(--text-muted); font-size:0.75rem; outline:none;">
      </div>

      <!-- 分類標籤 (純英文 5 等分 一行過) -->
      <div class="chip-group">
        <button class="chip active" onclick="handleCatClick('Chest')">Chest</button>
        <button class="chip" onclick="handleCatClick('Back')">Back</button>
        <button class="chip" onclick="handleCatClick('Arms')">Arms</button>
        <button class="chip" onclick="handleCatClick('Shoulders')">Shoulders</button>
        <button class="chip" onclick="handleCatClick('Legs')">Legs</button>
      </div>

      <!-- 動作網格 -->
      <div class="ex-grid" id="exGrid"></div>

      <!-- 上次紀錄看板 -->
      <div class="prev-box">
        <span style="color:var(--warning); font-weight:700;">🔍 上次紀錄：</span>
        <span id="prevSummary" style="color:var(--text-muted);">請先選擇動作</span>
      </div>

      <!-- 重量與次數 -->
      <div class="sets-header">
        <div>組數</div>
        <div id="weightHeaderLbl">重量 (lbs)</div>
        <div>次數 (Reps)</div>
        <div></div>
      </div>
      <div id="setsContainer"></div>

      <!-- ＋ 新增一組 -->
      <button class="btn-add-set" onclick="addSetRow()">＋ 新增一組</button>

      <!-- 器材備忘 -->
      <input type="text" id="noteInput" placeholder="器材設定 / 備忘" style="width:100%; background:var(--inner); border:1px solid var(--border); color:#fff; padding:8px 10px; border-radius:8px; font-size:0.78rem; margin-bottom:9px; outline:none;" />

      <button id="btnSave" class="btn-save" onclick="saveExerciseRecord()">💾 儲存動作</button>
    </div>

    <!-- 今日已完成列表 -->
    <div class="card">
      <div class="card-title">
        <span>📅 今日完成</span>
        <button class="btn-action" onclick="copyTodayFormatted()">📋 複製</button>
      </div>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- ================= TAB 2: 之前記錄 ================= -->
  <section id="tab2" style="display: none;">
    <div class="card">
      <div class="card-title">
        <span>📚 歷史紀錄</span>
        <button class="btn-action" onclick="toggleModal('backupModal')">📦 備份 / 匯入</button>
      </div>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ================= TAB 3: 深度分析數據 ================= -->
  <section id="tab3" style="display: none;">
    <!-- 1. 全身部位訓練組數佔比 (置頂) -->
    <div class="card">
      <div class="card-title"><span>📊 全身部位訓練組數佔比</span></div>
      <div id="muscleDistributionBar" style="display:flex; height:10px; border-radius:5px; overflow:hidden; background:#243044; margin-bottom:8px;"></div>
      <div id="muscleDistributionLegend" style="display:flex; justify-content:space-between; font-size:0.68rem; color:var(--text-muted); font-weight:700;"></div>
    </div>

    <!-- 2. 核心動作進度與趨勢 -->
    <div class="card">
      <div class="card-title">
        <span>📈 核心動作進度</span>
        <select id="analyticsExSelect" onchange="renderAnalytics()" style="background:var(--inner); border:1px solid var(--border); color:var(--accent); font-size:0.72rem; padding:4px 6px; border-radius:6px; outline:none; max-width:180px;"></select>
      </div>

      <!-- 4 大核心進度指標 -->
      <div class="stat-grid-4">
        <div class="stat-box">
          <div class="stat-val" id="statPrimaryMetric">--</div>
          <div class="stat-lbl" id="statPrimaryLbl">最佳重量 (lbs)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statEst1RM">--</div>
          <div class="stat-lbl">預估 1RM (lbs)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statTotalVol">--</div>
          <div class="stat-lbl">總訓練量 (lbs)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statTotalSets">--</div>
          <div class="stat-lbl">累積組數 / 次數</div>
        </div>
      </div>

      <!-- 互動折線圖容器 -->
      <div style="background:var(--inner); border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:6px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:0.68rem; font-weight:700;">
          <span style="color:var(--text-muted);">📈 力量與容量趨勢</span>
          <div style="display:flex; gap:10px;">
            <span style="color:#38bdf8;">● 重量/1RM</span>
            <span style="color:#f59e0b;">● 總容量</span>
          </div>
        </div>

        <!-- 觸控滑動即時數據顯示欄 -->
        <div id="chartTooltipBar" style="display:flex; justify-content:space-between; align-items:center; background:rgba(56,189,248,0.06); border:1px solid rgba(56,189,248,0.18); padding:5px 8px; border-radius:6px; margin-bottom:8px; font-size:0.72rem; font-family:monospace; min-height:26px;">
          <span id="ttDate" style="color:#fff; font-weight:700;">👆 滑動圖表查看數據</span>
          <span id="ttMetric" style="color:#38bdf8; font-weight:800;"></span>
          <span id="ttVol" style="color:#f59e0b; font-weight:800;"></span>
        </div>

        <canvas id="progressChart" style="width:100%; height:150px; display:block; touch-action:none;"></canvas>
      </div>

      <div class="card-title" style="margin-top:8px;"><span>歷史紀錄</span></div>
      <div id="analyticsTimeline"></div>
    </div>
  </section>

  <!-- 浮動 Toast 提示 -->
  <div id="toast" class="toast">✅ 已儲存動作</div>

  <!-- 備份與匯入 Modal (.json 檔案) -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:0.92rem; color:var(--accent);">📦 備份與匯入 (.json)</h3>
        <button onclick="toggleModal('backupModal')" style="background:transparent; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn-save" onclick="exportJSONFile()">📥 下載備份 .json 檔案</button>
        <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)" />
        <button class="btn-action" style="padding:11px; font-weight:700; color:#fff;" onclick="document.getElementById('jsonFileInput').click()">📤 選擇 .json 檔案匯入</button>
      </div>
      <p style="font-size:0.68rem; color:var(--text-muted); margin-top:10px; line-height:1.4;">
        * 匯入檔案會將舊紀錄與新紀錄自動合併入手機 LocalStorage 內。
      </p>
    </div>
  </div>

  <!-- 新增自訂動作 Modal -->
  <div class="modal" id="customExModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:0.92rem; color:var(--accent);">＋ 新增自訂動作</h3>
        <button onclick="toggleModal('customExModal')" style="background:transparent; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="newExName" placeholder="動作名稱 (例: Cable Row)" style="background:var(--inner); border:1px solid var(--border); color:#fff; padding:9px; border-radius:8px; font-size:0.82rem; outline:none;">
        <select id="newExCat" style="background:var(--inner); border:1px solid var(--border); color:var(--accent); padding:9px; border-radius:8px; font-size:0.82rem; outline:none;">
          <option value="Chest">Chest</option>
          <option value="Back">Back</option>
          <option value="Arms">Arms</option>
          <option value="Shoulders">Shoulders</option>
          <option value="Legs">Legs</option>
        </select>
        <button class="btn-save" onclick="saveCustomExercise()">確認新增動作</button>
      </div>
    </div>
  </div>

<script>
  // 基礎動作庫
  const DEFAULT_EXERCISES = [
    { cat: 'Chest', name: 'Chest press' },
    { cat: 'Chest', name: 'Pec fly' },
    { cat: 'Chest', name: 'High cable fly' },
    { cat: 'Chest', name: 'Cable Pec fly' },
    { cat: 'Back', name: 'Assist pullup' },
    { cat: 'Back', name: 'Row' },
    { cat: 'Back', name: '單手 Row' },
    { cat: 'Back', name: 'Row 中背' },
    { cat: 'Back', name: 'Pulldown' },
    { cat: 'Back', name: 'Re pec fly' },
    { cat: 'Arms', name: 'Overhead Triceps Extension' },
    { cat: 'Arms', name: 'Tricep Pushdown' },
    { cat: 'Arms', name: 'Incline Dumbbell Curl' },
    { cat: 'Arms', name: 'Preacher Curl' },
    { cat: 'Shoulders', name: 'Lateral raise' },
    { cat: 'Shoulders', name: 'Shoulder press' },
    { cat: 'Legs', name: 'Leg press' },
    { cat: 'Legs', name: 'Leg curl' }
  ];

  // 數據分析限定追蹤的 9 大核心動作
  const ANALYTICS_TARGET_EXERCISES = [
    'Chest press',
    'Assist pullup',
    'Pec fly',
    'Re pec fly',
    'Lateral raise',
    'Overhead Triceps Extension',
    'Tricep Pushdown',
    'Incline Dumbbell Curl',
    'Preacher Curl'
  ];

  let currentCategory = 'Chest';
  let selectedExercise = 'Chest press';
  let db = JSON.parse(localStorage.getItem('GYM_LOG_DB_V2') || '[]');
  let customExercises = JSON.parse(localStorage.getItem('GYM_CUSTOM_EX') || '[]');

  // 編輯模式狀態變量
  let editingRecordId = null;

  // 圖表互動狀態
  let activeChartData = [];
  let activeChartIsAssist = false;
  let activeHoverIndex = -1;

  // 初始化本地日期 (避免 UTC 跨日偏差)
  const dateInput = document.getElementById('gymDate');
  const now = new Date();
  const localYear = now.getFullYear();
  const localMonth = String(now.getMonth() + 1).padStart(2, '0');
  const localDay = String(now.getDate()).padStart(2, '0');
  dateInput.value = `${localYear}-${localMonth}-${localDay}`;
  dateInput.addEventListener('change', renderTodayList);

  function normalizeCategory(cat) {
    if (!cat) return 'Chest';
    if (cat === '胸' || cat.toLowerCase() === 'chest') return 'Chest';
    if (cat === '背' || cat.toLowerCase() === 'back') return 'Back';
    if (cat === '手臂' || cat.toLowerCase() === 'arms') return 'Arms';
    if (cat === '肩' || cat.toLowerCase() === 'shoulders') return 'Shoulders';
    if (cat === '腿' || cat.toLowerCase() === 'legs') return 'Legs';
    return cat;
  }

  function getAllExercises() {
    return [...DEFAULT_EXERCISES, ...customExercises];
  }

  // 防呆檢查：檢查用戶當前在輸入框是否有實際輸入數值或備忘文字
  function checkHasDirtyInput() {
    const rows = document.querySelectorAll('#setsContainer .set-row');
    for (let r of rows) {
      const w = r.querySelector('.set-weight').value.trim();
      const rep = r.querySelector('.set-reps').value.trim();
      if (w !== '' || rep !== '') return true;
    }
    const note = document.getElementById('noteInput').value.trim();
    if (editingRecordId === null && note !== '') return true;
    return false;
  }

  function handleCatClick(cat) {
    if (cat === currentCategory) return;
    if (checkHasDirtyInput()) {
      if (!confirm("當前輸入尚未儲存，是否放棄並切換部位？")) return;
    }
    resetEditingMode();
    filterCat(cat);
  }

  function handleExClick(name) {
    if (name === selectedExercise && editingRecordId === null) return;
    if (checkHasDirtyInput()) {
      if (!confirm("當前輸入尚未儲存，是否放棄並切換動作？")) return;
    }
    resetEditingMode();
    selectExercise(name);
  }

  // 1. Tab 切換
  function switchTab(tabNum) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`tab${i}`).style.display = (i === tabNum) ? 'block' : 'none';
      document.getElementById(`tabBtn${i}`).classList.toggle('active', i === tabNum);
    });
    if (tabNum === 1) renderTodayList();
    if (tabNum === 2) renderHistory();
    if (tabNum === 3) {
      renderMuscleDistribution();
      populateAnalyticsDropdown();
    }
  }

  // 2. 動作選擇與網格
  function filterCat(cat) {
    currentCategory = cat;
    document.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.textContent.trim().toLowerCase() === cat.toLowerCase());
    });
    renderExGrid();
  }

  function renderExGrid() {
    const grid = document.getElementById('exGrid');
    grid.innerHTML = '';
    const all = getAllExercises();
    const filtered = all.filter(e => normalizeCategory(e.cat) === currentCategory);

    filtered.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'ex-btn' + (selectedExercise === e.name ? ' selected' : '');
      btn.textContent = e.name;
      btn.onclick = () => handleExClick(e.name);
      grid.appendChild(btn);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'btn-custom-ex';
    addBtn.textContent = `＋ 自訂【${currentCategory}】新動作`;
    addBtn.onclick = () => {
      document.getElementById('newExCat').value = currentCategory;
      toggleModal('customExModal');
    };
    grid.appendChild(addBtn);
  }

  function saveCustomExercise() {
    const name = document.getElementById('newExName').value.trim();
    const cat = document.getElementById('newExCat').value;
    if (!name) return;

    if (getAllExercises().some(e => e.name.toLowerCase() === name.toLowerCase())) {
      showToast('⚠️ 動作名稱已存在');
      return;
    }

    customExercises.push({ cat, name });
    localStorage.setItem('GYM_CUSTOM_EX', JSON.stringify(customExercises));
    document.getElementById('newExName').value = '';
    toggleModal('customExModal');
    filterCat(cat);
    selectExercise(name);
    showToast(`✅ 已新增動作：${name}`);
  }

  // 3. 選中動作 ➔ 自動以半透明 Placeholder 帶入上次數據
  function selectExercise(name) {
    selectedExercise = name;
    renderExGrid();

    const isAssist = name.toLowerCase().includes('assist');
    document.getElementById('weightHeaderLbl').textContent = isAssist ? '輔助重量 (lbs)' : '重量 (lbs)';

    const history = db
      .filter(item => item.name.toLowerCase() === name.toLowerCase())
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const prevBox = document.getElementById('prevSummary');
    const container = document.getElementById('setsContainer');
    container.innerHTML = '';

    if (history.length > 0) {
      const last = history[0];
      prevBox.innerHTML = `<strong>${last.date}</strong> ➔ ${last.formatted}`;
      document.getElementById('noteInput').value = last.note || '';

      last.sets.forEach(set => addSetRow(set.weight, set.reps));
      while (container.children.length < 3) addSetRow('', '');
    } else {
      prevBox.innerHTML = `<span style="color:var(--text-muted);">無歷史紀錄 (新動作)</span>`;
      document.getElementById('noteInput').value = '';
      addSetRow('', '');
      addSetRow('', '');
      addSetRow('', '');
    }
  }

  // 載入指定完成紀錄到上方進行修改
  function loadRecordForEdit(recordId) {
    const item = db.find(r => r.id === recordId);
    if (!item) return;

    if (checkHasDirtyInput() && editingRecordId !== recordId) {
      if (!confirm("當前輸入尚未儲存，是否放棄並載入修改此紀錄？")) return;
    }

    editingRecordId = item.id;
    const cat = normalizeCategory(item.category);
    currentCategory = cat;
    filterCat(cat);
    selectedExercise = item.name;
    renderExGrid();

    const isAssist = item.name.toLowerCase().includes('assist');
    document.getElementById('weightHeaderLbl').textContent = isAssist ? '輔助重量 (lbs)' : '重量 (lbs)';

    const history = db
      .filter(it => it.name.toLowerCase() === item.name.toLowerCase() && it.id !== item.id)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const prevBox = document.getElementById('prevSummary');
    if (history.length > 0) {
      prevBox.innerHTML = `<strong>${history[0].date}</strong> ➔ ${history[0].formatted}`;
    } else {
      prevBox.innerHTML = `<span style="color:var(--text-muted);">歷史紀錄</span>`;
    }

    // 將該次完成的數據實體載入輸入框
    const container = document.getElementById('setsContainer');
    container.innerHTML = '';
    item.sets.forEach(s => {
      addSetRow(s.weight, s.reps, true);
    });

    document.getElementById('noteInput').value = item.note || '';

    // 更新儲存按鈕外觀為「修改模式」
    const saveBtn = document.getElementById('btnSave');
    saveBtn.textContent = '💾 更新修改紀錄 (點擊保存)';
    saveBtn.classList.add('editing-mode');

    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast(`✏️ 載入 ${item.name} 進行修改`);
  }

  function resetEditingMode() {
    editingRecordId = null;
    const saveBtn = document.getElementById('btnSave');
    saveBtn.textContent = '💾 儲存動作';
    saveBtn.classList.remove('editing-mode');
  }

  function addSetRow(wVal = '', repVal = '', isEditValue = false) {
    const container = document.getElementById('setsContainer');
    const setIndex = container.children.length + 1;

    const row = document.createElement('div');
    row.className = 'set-row';
    const initW = isEditValue ? wVal : '';
    const initRep = isEditValue ? repVal : '';
    const phW = (!isEditValue && wVal !== '') ? wVal : 'lbs';
    const phRep = (!isEditValue && repVal !== '') ? repVal : '次';

    row.innerHTML = `
      <div class="set-tag">S${setIndex}</div>
      <input type="number" step="any" class="num-input set-weight" placeholder="${phW}" value="${initW}">
      <input type="number" class="num-input set-reps" placeholder="${phRep}" value="${initRep}">
      <button class="btn-del-set" onclick="delSetRow(this)">✕</button>
    `;
    container.appendChild(row);
  }

  function delSetRow(btn) {
    const container = document.getElementById('setsContainer');
    if (container.children.length <= 1) return;
    btn.parentElement.remove();
    Array.from(container.children).forEach((row, idx) => {
      row.querySelector('.set-tag').textContent = `S${idx + 1}`;
    });
  }

  // 4. 儲存動作 (支援新增與更新覆蓋)
  function saveExerciseRecord() {
    const date = dateInput.value;
    const note = document.getElementById('noteInput').value.trim();
    const rows = document.querySelectorAll('#setsContainer .set-row');

    const sets = [];
    rows.forEach(r => {
      const wInput = r.querySelector('.set-weight');
      const repInput = r.querySelector('.set-reps');

      const rawW = wInput.value.trim() !== '' ? wInput.value.trim() : wInput.placeholder;
      const rawRep = repInput.value.trim() !== '' ? repInput.value.trim() : repInput.placeholder;

      const w = parseFloat(rawW);
      const rep = parseInt(rawRep);

      if (!isNaN(w) && !isNaN(rep)) {
        sets.push({ weight: w, reps: rep });
      }
    });

    if (sets.length === 0) {
      showToast('⚠️ 請至少輸入一組完整數據');
      return;
    }

    const formatted = formatSetsToText(sets, note);
    const all = getAllExercises();
    const matched = all.find(e => e.name.toLowerCase() === selectedExercise.toLowerCase());
    const matchCat = matched ? normalizeCategory(matched.cat) : currentCategory;

    if (editingRecordId !== null) {
      // 原地更新修改模式
      const idx = db.findIndex(r => r.id === editingRecordId);
      if (idx !== -1) {
        db[idx].sets = sets;
        db[idx].note = note;
        db[idx].formatted = formatted;
        db[idx].category = matchCat;
        db[idx].name = selectedExercise;
      }
      showToast(`✅ 已更新 ${selectedExercise}`);
      resetEditingMode();
    } else {
      // 原生新增模式
      const record = {
        id: Date.now(),
        date: date,
        name: selectedExercise,
        category: matchCat,
        sets: sets,
        note: note,
        formatted: formatted
      };
      db.push(record);
      showToast(`✅ 已儲存 ${selectedExercise}`);
    }

    localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));
    renderTodayList();
    selectExercise(selectedExercise);
  }

  function formatSetsToText(sets, note) {
    let parts = [];
    let curWeight = null;
    let curReps = [];

    sets.forEach(s => {
      if (s.weight === curWeight) {
        curReps.push(s.reps);
      } else {
        if (curWeight !== null) parts.push(`${curWeight}lbs ${curReps.join(',')}`);
        curWeight = s.weight;
        curReps = [s.reps];
      }
    });
    if (curWeight !== null) parts.push(`${curWeight}lbs ${curReps.join(',')}`);
    let res = parts.join(' ');
    if (note) res += ` ${note}`;
    return res;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  // 5. 今日完成清單 (點擊紀錄項目可直接載入上方修改)
  function renderTodayList() {
    const curDate = dateInput.value;
    const listEl = document.getElementById('todayList');
    const items = db.filter(item => item.date === curDate);

    if (items.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:10px;">今日仲未有記錄</div>';
      return;
    }

    listEl.innerHTML = items.map(item => `
      <div class="log-item" onclick="loadRecordForEdit(${item.id})">
        <div class="log-head">
          <span class="log-title">${item.name} <span style="font-size:0.65rem; color:var(--warning); font-weight:normal;">(點擊修改)</span></span>
          <button style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:0.75rem;" onclick="event.stopPropagation(); deleteRecord(${item.id})">刪除</button>
        </div>
        <div class="log-body">${item.formatted}</div>
      </div>
    `).join('');
  }

  function deleteRecord(id) {
    if (editingRecordId === id) resetEditingMode();
    db = db.filter(item => item.id !== id);
    localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));
    renderTodayList();
    renderHistory();
    showToast('🗑️ 已刪除記錄');
  }

  // 6. 複製今日格式 (徹底修復 UTC 時區導致日期變昨天問題)
  function copyTodayFormatted() {
    const curDate = dateInput.value;
    const items = db.filter(item => item.date === curDate);
    if (items.length === 0) {
      showToast('⚠️ 今日無任何記錄');
      return;
    }
    
    // 直接字串分割取得選取日期，絕不受瀏覽器 UTC-4 時區偏移影響
    const [y, m, d] = curDate.split('-').map(v => parseInt(v, 10));
    let out = `${d}/${m}\n`;
    items.forEach(item => { out += `${item.name} ${item.formatted}\n`; });
    navigator.clipboard.writeText(out.trim()).then(() => showToast('📋 已複製發佈文字'));
  }

  // 7. 歷史記錄
  function renderHistory() {
    const listEl = document.getElementById('historyList');
    if (db.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:20px;">暫無歷史記錄</div>';
      return;
    }

    const groups = {};
    db.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
      if (!groups[item.date]) groups[item.date] = [];
      groups[item.date].push(item);
    });

    listEl.innerHTML = Object.keys(groups).map(date => {
      const items = groups[date];
      const itemsHtml = items.map(it => `
        <div style="margin-top:5px; font-size:0.78rem;">
          <span style="color:var(--accent); font-weight:700;">${it.name}</span>: 
          <span style="font-family:monospace;">${it.formatted}</span>
        </div>
      `).join('');

      return `
        <div class="log-item" style="margin-bottom:10px; cursor:default;">
          <div class="log-head" style="border-bottom:1px solid var(--border); padding-bottom:5px;">
            <span style="font-weight:800; color:#fff;">📅 ${date}</span>
            <span style="font-size:0.68rem; color:var(--text-muted);">${items.length} 個動作</span>
          </div>
          ${itemsHtml}
        </div>
      `;
    }).join('');
  }

  // 8. 深度分析數據 (折線圖 + 指標 + Timeline)
  function populateAnalyticsDropdown() {
    const sel = document.getElementById('analyticsExSelect');
    sel.innerHTML = ANALYTICS_TARGET_EXERCISES.map(e => `<option value="${e}">${e}</option>`).join('');
    renderAnalytics();
  }

  function renderAnalytics() {
    const exName = document.getElementById('analyticsExSelect').value;
    const timelineEl = document.getElementById('analyticsTimeline');
    if (!exName) return;

    const recordsDesc = db.filter(i => i.name.toLowerCase() === exName.toLowerCase()).sort((a, b) => new Date(b.date) - new Date(a.date));
    const recordsAsc = [...recordsDesc].reverse();
    const isAssist = exName.toLowerCase().includes('assist');

    if (recordsDesc.length === 0) {
      document.getElementById('statPrimaryMetric').textContent = '--';
      document.getElementById('statEst1RM').textContent = '--';
      document.getElementById('statTotalVol').textContent = '0';
      document.getElementById('statTotalSets').textContent = '0 組';
      timelineEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:15px;">暫無此動作的訓練數據</div>';
      activeChartData = [];
      drawEmptyChart();
      return;
    }

    let bestWeight = isAssist ? 9999 : 0;
    let max1RM = 0;
    let totalVolume = 0;
    let totalSetsCount = 0;

    const timelineHtml = recordsDesc.map(rec => {
      let sessionVol = 0;
      let sessionBest1RM = 0;
      let sessionBestWeight = isAssist ? 9999 : 0;

      rec.sets.forEach(s => {
        totalSetsCount++;
        const vol = s.weight * s.reps;
        sessionVol += vol;
        totalVolume += vol;

        if (isAssist) {
          if (s.weight < sessionBestWeight) sessionBestWeight = s.weight;
          if (s.weight < bestWeight) bestWeight = s.weight;
        } else {
          if (s.weight > sessionBestWeight) sessionBestWeight = s.weight;
          if (s.weight > bestWeight) bestWeight = s.weight;
          const e1rm = s.weight * (1 + s.reps / 30);
          if (e1rm > sessionBest1RM) sessionBest1RM = e1rm;
          if (e1rm > max1RM) max1RM = e1rm;
        }
      });

      return `
        <div class="history-row">
          <div>
            <div style="font-weight:700; color:#fff;">${rec.date}</div>
            <div style="color:var(--text-muted); font-size:0.7rem; font-family:monospace;">${rec.formatted}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; color:var(--accent); font-family:monospace;">
              ${isAssist ? (sessionBestWeight + ' lbs (輔助)') : (Math.round(sessionBest1RM) + ' lbs 1RM')}
            </div>
            <div style="font-size:0.65rem; color:var(--text-muted);">容量: ${Math.round(sessionVol)} lbs</div>
          </div>
        </div>
      `;
    }).join('');

    if (isAssist) {
      document.getElementById('statPrimaryLbl').textContent = '最低輔助 (最勁紀錄)';
      document.getElementById('statPrimaryMetric').textContent = (bestWeight === 9999 ? '--' : bestWeight + ' lbs');
      document.getElementById('statEst1RM').textContent = '愈輕愈好';
    } else {
      document.getElementById('statPrimaryLbl').textContent = '歷史最高重量 (lbs)';
      document.getElementById('statPrimaryMetric').textContent = bestWeight || '--';
      document.getElementById('statEst1RM').textContent = Math.round(max1RM) || '--';
    }

    document.getElementById('statTotalVol').textContent = Math.round(totalVolume).toLocaleString();
    document.getElementById('statTotalSets').textContent = `${totalSetsCount} 組 (${recordsDesc.length} 次)`;
    timelineEl.innerHTML = timelineHtml;

    activeChartData = recordsAsc.map(rec => {
      let sessionVol = 0;
      let sessionMetric = 0;
      if (isAssist) {
        let minW = 9999;
        rec.sets.forEach(s => {
          sessionVol += s.weight * s.reps;
          if (s.weight < minW) minW = s.weight;
        });
        sessionMetric = minW;
      } else {
        let best1RM = 0;
        rec.sets.forEach(s => {
          sessionVol += s.weight * s.reps;
          const e1rm = s.weight * (1 + s.reps / 30);
          if (e1rm > best1RM) best1RM = e1rm;
        });
        sessionMetric = Math.round(best1RM);
      }
      return {
        fullDate: rec.date,
        date: rec.date.slice(5).replace('-', '/'),
        metric: sessionMetric,
        volume: sessionVol
      };
    });
    activeChartIsAssist = isAssist;
    activeHoverIndex = activeChartData.length - 1;

    updateChartTooltip(activeHoverIndex);
    drawChart();
  }

  function updateChartTooltip(idx) {
    if (idx < 0 || idx >= activeChartData.length) {
      document.getElementById('ttDate').textContent = '👆 滑動圖表查看數據';
      document.getElementById('ttMetric').textContent = '';
      document.getElementById('ttVol').textContent = '';
      return;
    }
    const d = activeChartData[idx];
    document.getElementById('ttDate').textContent = `📅 ${d.fullDate}`;
    document.getElementById('ttMetric').textContent = activeChartIsAssist ? `輔助: ${d.metric} lbs` : `1RM: ${d.metric} lbs`;
    document.getElementById('ttVol').textContent = `容量: ${Math.round(d.volume).toLocaleString()} lbs`;
  }

  function drawChart() {
    const canvas = document.getElementById('progressChart');
    if (!canvas || activeChartData.length === 0) return;
    const ctx = canvas.getContext('2d');

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = 150 * dpr;
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = 150;
    ctx.clearRect(0, 0, w, h);

    const padL = 30, padR = 25, padT = 16, padB = 24;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;

    const metricVals = activeChartData.map(d => d.metric);
    const volVals = activeChartData.map(d => d.volume);

    let minM = Math.min(...metricVals) * 0.9;
    let maxM = Math.max(...metricVals) * 1.1;
    if (minM === maxM) { minM -= 5; maxM += 5; }

    let minV = Math.min(...volVals) * 0.85;
    let maxV = Math.max(...volVals) * 1.15;
    if (minV === maxV) { minV = 0; maxV += 100; }

    const getX = (idx) => {
      if (activeChartData.length === 1) return padL + plotW / 2;
      return padL + (idx / (activeChartData.length - 1)) * plotW;
    };
    const getY_M = (val) => padT + plotH - ((val - minM) / (maxM - minM)) * plotH;
    const getY_V = (val) => padT + plotH - ((val - minV) / (maxV - minV)) * plotH;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const y = padT + (plotH / 3) * i;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(w - padR, y);
      ctx.stroke();
    }

    // 總容量
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    activeChartData.forEach((d, i) => {
      const x = getX(i);
      const y = getY_V(d.volume);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 重量/1RM
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    activeChartData.forEach((d, i) => {
      const x = getX(i);
      const y = getY_M(d.metric);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    activeChartData.forEach((d, i) => {
      const x = getX(i);
      if (activeChartData.length <= 30 || i === activeHoverIndex) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(x, getY_M(d.metric), 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    const len = activeChartData.length;
    let labelIndices = [];
    if (len <= 5) {
      labelIndices = activeChartData.map((_, idx) => idx);
    } else {
      labelIndices = [0, Math.floor(len * 0.25), Math.floor(len * 0.5), Math.floor(len * 0.75), len - 1];
    }

    ctx.fillStyle = '#64748b';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    labelIndices.forEach(idx => {
      const x = getX(idx);
      ctx.fillText(activeChartData[idx].date, x, h - 6);
    });

    if (activeHoverIndex >= 0 && activeHoverIndex < activeChartData.length) {
      const hX = getX(activeHoverIndex);
      const hY_M = getY_M(activeChartData[activeHoverIndex].metric);
      const hY_V = getY_V(activeChartData[activeHoverIndex].volume);

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(hX, padT);
      ctx.lineTo(hX, h - padB);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(hX, hY_V, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0b0f17';
      ctx.beginPath();
      ctx.arc(hX, hY_M, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(hX, hY_M, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawEmptyChart() {
    const canvas = document.getElementById('progressChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = 150 * dpr;
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, rect.width, 150);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('需至少 1 次訓練數據以生成趨勢線', rect.width / 2, 75);
    updateChartTooltip(-1);
  }

  const chartCanvas = document.getElementById('progressChart');
  function handleChartHover(e) {
    if (activeChartData.length === 0) return;
    const rect = chartCanvas.getBoundingClientRect();
    const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
    const offsetX = clientX - rect.left;

    const padL = 30, padR = 25;
    const plotW = rect.width - padL - padR;

    let clampedX = Math.max(0, Math.min(plotW, offsetX - padL));
    let ratio = clampedX / plotW;
    let closestIndex = Math.round(ratio * (activeChartData.length - 1));

    if (closestIndex !== activeHoverIndex) {
      activeHoverIndex = closestIndex;
      updateChartTooltip(activeHoverIndex);
      drawChart();
    }
  }

  chartCanvas.addEventListener('touchstart', (e) => { handleChartHover(e); }, { passive: true });
  chartCanvas.addEventListener('touchmove', (e) => { handleChartHover(e); }, { passive: true });
  chartCanvas.addEventListener('mousemove', (e) => { handleChartHover(e); });

  function renderMuscleDistribution() {
    const cats = { 'Chest': 0, 'Back': 0, 'Arms': 0, 'Shoulders': 0, 'Legs': 0 };
    let totalSets = 0;

    db.forEach(rec => {
      const c = normalizeCategory(rec.category);
      const setsCount = rec.sets ? rec.sets.length : 1;
      if (cats[c] !== undefined) {
        cats[c] += setsCount;
        totalSets += setsCount;
      }
    });

    if (totalSets === 0) return;

    const colors = { 'Chest': '#38bdf8', 'Back': '#10b981', 'Arms': '#f59e0b', 'Shoulders': '#ec4899', 'Legs': '#a855f7' };
    const barEl = document.getElementById('muscleDistributionBar');
    const legendEl = document.getElementById('muscleDistributionLegend');

    barEl.innerHTML = Object.keys(cats).map(c => {
      const pct = (cats[c] / totalSets) * 100;
      return `<div style="width:${pct}%; background:${colors[c]}; height:100%;"></div>`;
    }).join('');

    legendEl.innerHTML = Object.keys(cats).map(c => {
      const pct = Math.round((cats[c] / totalSets) * 100);
      return `<span style="color:${colors[c]}">${c} ${pct}%</span>`;
    }).join('');
  }

  // 9. 匯入 / 匯出 .json 檔案
  function exportJSONFile() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `gym_backup_${dateInput.value}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('📥 備份檔案已下載');
  }

  function handleFileImport(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const imported = JSON.parse(evt.target.result);
        if (Array.isArray(imported)) {
          db = imported;
          localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));
          toggleModal('backupModal');
          renderTodayList();
          renderHistory();
          selectExercise(selectedExercise);
          showToast(`✅ 成功匯入 ${db.length} 條紀錄！`);
        } else {
          showToast('⚠️ 檔案格式錯誤 (非 Array)');
        }
      } catch (err) {
        showToast('⚠️ JSON 解析失敗');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function toggleModal(id) {
    const m = document.getElementById(id);
    m.classList.toggle('active');
  }

  // 啟動初始化
  filterCat('Chest');
  selectExercise('Chest press');
  renderTodayList();
</script>
</body>
</html>
