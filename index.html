<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gym Log 16吋手臂</title>

  <!-- iOS PWA 全螢幕與離線設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymLog" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/dumbbell.png" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --inner: #0b1120;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 500px; margin: 0 auto; -webkit-tap-highlight-color: transparent; padding-bottom: 40px; }

    /* 頂部導航 Tab */
    .top-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 9px 4px; font-size: 0.78rem; font-weight: 700; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
    .nav-btn.active { background: var(--accent); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    /* 部位標籤與動作選擇 */
    .chip-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
    .chip { font-size: 0.75rem; font-weight: 600; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--inner); color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 130px; overflow-y: auto; margin-bottom: 10px; }
    .ex-btn { font-size: 0.72rem; padding: 8px 4px; text-align: center; border-radius: 8px; border: 1px solid var(--border); background: var(--inner); color: var(--text); cursor: pointer; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ex-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }

    /* 上次紀錄看板 */
    .prev-box { background: var(--inner); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; font-size: 0.75rem; line-height: 1.4; margin-bottom: 12px; }

    /* 6個輸入框 (Set Rows) */
    .sets-header { display: grid; grid-template-columns: 44px 1fr 1fr 32px; gap: 6px; font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-align: center; margin-bottom: 4px; }
    .set-row { display: grid; grid-template-columns: 44px 1fr 1fr 32px; gap: 6px; align-items: center; margin-bottom: 6px; }
    .set-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-align: center; background: var(--inner); padding: 7px 0; border-radius: 6px; border: 1px solid var(--border); }
    .num-input { width: 100%; background: var(--inner); border: 1px solid var(--border); color: #fff; font-size: 0.95rem; font-weight: 700; text-align: center; padding: 7px 4px; border-radius: 8px; outline: none; font-family: monospace; }
    .num-input:focus { border-color: var(--accent); }
    .btn-del-set { background: transparent; border: none; color: var(--danger); font-size: 1rem; cursor: pointer; }

    .btn-add-set { width: 100%; background: var(--inner); border: 1px dashed var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-top: 4px; margin-bottom: 10px; }
    .btn-add-set:active { background: var(--accent-dim); }

    .btn-save { width: 100%; background: var(--accent); color: #000; font-weight: 800; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; }
    .btn-save:active { transform: scale(0.98); }

    /* 今日清單與歷史列表 */
    .log-item { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .log-title { font-weight: 700; font-size: 0.88rem; color: var(--accent); }
    .log-body { font-family: monospace; font-size: 0.82rem; color: var(--text); }
    .log-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

    /* 分析頁面 */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-val { font-size: 1.25rem; font-weight: 800; color: var(--accent); font-family: monospace; }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    .history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.78rem; }
    .history-row:last-child { border-bottom: none; }

    /* 彈窗 Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 16px; z-index: 100; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; width: 100%; max-width: 460px; }
    .textarea-box { width: 100%; height: 130px; background: var(--inner); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px; font-family: monospace; font-size: 0.75rem; margin-top: 8px; }
    .btn-action { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 頂部 3 個主要選擇 -->
  <nav class="top-nav">
    <button class="nav-btn active" id="tabBtn1" onclick="switchTab(1)">1. 記錄今日 Gym</button>
    <button class="nav-btn" id="tabBtn2" onclick="switchTab(2)">2. 之前記錄</button>
    <button class="nav-btn" id="tabBtn3" onclick="switchTab(3)">3. 分析數據</button>
  </nav>

  <!-- ================= TAB 1: 記錄今日 ================= -->
  <section id="tab1">
    <div class="card">
      <div class="card-title">
        <span>🏋️ 選擇訓練動作</span>
        <input type="date" id="gymDate" style="background:transparent; border:none; color:var(--text-muted); font-size:0.75rem; outline:none;">
      </div>

      <!-- 分類標籤 -->
      <div class="chip-group">
        <button class="chip active" onclick="filterCat('胸')">胸 (Chest)</button>
        <button class="chip" onclick="filterCat('背')">背 (Back)</button>
        <button class="chip" onclick="filterCat('手臂')">手臂 (Arms)</button>
        <button class="chip" onclick="filterCat('肩')">肩 (Shoulders)</button>
        <button class="chip" onclick="filterCat('腿')">腿 (Legs)</button>
      </div>

      <!-- 動作網格 -->
      <div class="ex-grid" id="exGrid"></div>

      <!-- 上次紀錄看板 -->
      <div class="prev-box">
        <span style="color:var(--warning); font-weight:700;">🔍 上次紀錄：</span>
        <span id="prevSummary" style="color:var(--text-muted);">請先選擇動作</span>
      </div>

      <!-- 重量與次數輸入 (預設 3 組 = 6 個 Textbox) -->
      <div class="sets-header">
        <div>組數</div>
        <div>重量 (lbs)</div>
        <div>次數 (Reps)</div>
        <div></div>
      </div>
      <div id="setsContainer"></div>

      <!-- + 加第4組或更多按鈕 -->
      <button class="btn-add-set" onclick="addSetRow()">＋ 新增一組 (Add Set)</button>

      <!-- 器材設定與備忘 (如：坐第4格) -->
      <input type="text" id="noteInput" placeholder="器材設定 / 備忘 (例如: 坐第4格、單手、每邊)" style="width:100%; background:var(--inner); border:1px solid var(--border); color:#fff; padding:8px 10px; border-radius:8px; font-size:0.8rem; margin-bottom:10px; outline:none;" />

      <button class="btn-save" onclick="saveExerciseRecord()">💾 儲存動作 (離線自動保存)</button>
    </div>

    <!-- 今日已完成列表 -->
    <div class="card">
      <div class="card-title">
        <span>📅 今日已完成動作</span>
        <button class="btn-action" onclick="copyTodayFormatted()">📋 複製發佈格式</button>
      </div>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- ================= TAB 2: 之前記錄 ================= -->
  <section id="tab2" style="display: none;">
    <div class="card">
      <div class="card-title">
        <span>📚 歷史紀錄一覽</span>
        <button class="btn-action" onclick="toggleModal('backupModal')">📦 備份 / 匯入</button>
      </div>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ================= TAB 3: 分析數據 ================= -->
  <section id="tab3" style="display: none;">
    <div class="card">
      <div class="card-title">
        <span>📈 動作進度分析</span>
        <select id="analyticsExSelect" onchange="renderAnalytics()" style="background:var(--inner); border:1px solid var(--border); color:var(--accent); font-size:0.75rem; padding:4px 8px; border-radius:6px; outline:none; max-width:180px;"></select>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="statMaxWeight">--</div>
          <div class="stat-lbl">歷史最高重量 (lbs)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statMax1RM">--</div>
          <div class="stat-lbl">預估 1RM 極限 (lbs)</div>
        </div>
      </div>

      <div class="card-title" style="margin-top:10px;"><span>力量增長歷程 (由近至遠)</span></div>
      <div id="analyticsTimeline"></div>
    </div>
  </section>

  <!-- 備份與匯入 Modal -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 0.95rem; color: var(--accent);">📦 資料備份與匯入</h3>
        <button onclick="toggleModal('backupModal')" style="background:transparent; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <button class="btn-action" style="flex:1; background:var(--accent); color:#000; font-weight:700;" onclick="exportJSON()">📥 匯出備份 JSON</button>
        <button class="btn-action" style="flex:1;" onclick="importJSON()">📤 貼上內容匯入</button>
      </div>
      <textarea id="backupTextarea" class="textarea-box" placeholder="在此貼上備份 JSON 數據..."></textarea>
    </div>
  </div>

<script>
  // 常用動作資料庫
  const EXERCISES = [
    { cat: '胸', name: 'Chest press' },
    { cat: '胸', name: 'Pec fly' },
    { cat: '胸', name: 'High cable fly' },
    { cat: '胸', name: 'Cable Pec fly' },
    { cat: '背', name: 'Assist pullup' },
    { cat: '背', name: 'Row' },
    { cat: '背', name: '單手 Row' },
    { cat: '背', name: 'Row 中背' },
    { cat: '背', name: 'Pulldown' },
    { cat: '手臂', name: 'Overhead Triceps Extension' },
    { cat: '手臂', name: 'Tricep Pushdown' },
    { cat: '手臂', name: 'Incline Dumbbell Curl' },
    { cat: '手臂', name: 'Preacher Curl' },
    { cat: '肩', name: 'Lateral raise' },
    { cat: '肩', name: 'Shoulder press' },
    { cat: '肩', name: 'Re pec fly' },
    { cat: '腿', name: 'Leg press' },
    { cat: '腿', name: 'Leg curl' }
  ];

  let currentCategory = '胸';
  let selectedExercise = 'Chest press';
  let db = JSON.parse(localStorage.getItem('GYM_LOG_DB_V2') || '[]');

  // 初始化日期
  const dateInput = document.getElementById('gymDate');
  dateInput.value = new Date().toISOString().split('T')[0];
  dateInput.addEventListener('change', renderTodayList);

  // 1. Tab 切換邏輯
  function switchTab(tabNum) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`tab${i}`).style.display = (i === tabNum) ? 'block' : 'none';
      document.getElementById(`tabBtn${i}`).classList.toggle('active', i === tabNum);
    });
    if (tabNum === 1) renderTodayList();
    if (tabNum === 2) renderHistory();
    if (tabNum === 3) populateAnalyticsDropdown();
  }

  // 2. 動作與分類選擇
  function filterCat(cat) {
    currentCategory = cat;
    document.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.textContent.includes(cat));
    });
    renderExGrid();
  }

  function renderExGrid() {
    const grid = document.getElementById('exGrid');
    grid.innerHTML = '';
    const filtered = EXERCISES.filter(e => e.cat === currentCategory);
    filtered.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'ex-btn' + (selectedExercise === e.name ? ' selected' : '');
      btn.textContent = e.name;
      btn.onclick = () => selectExercise(e.name);
      grid.appendChild(btn);
    });
  }

  // 3. 核心：選中動作 ➔ 自動帶入上次的重量與次數（預設 3 組 = 6 個輸入框）
  function selectExercise(name) {
    selectedExercise = name;
    renderExGrid();

    // 尋找此動作最近一次紀錄
    const history = db
      .filter(item => item.name.toLowerCase() === name.toLowerCase())
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const prevBox = document.getElementById('prevSummary');
    const container = document.getElementById('setsContainer');
    container.innerHTML = '';

    if (history.length > 0) {
      const last = history[0];
      prevBox.innerHTML = `<strong>${last.date}</strong> ➔ ${last.formatted}`;
      document.getElementById('noteInput').value = last.note || '';

      // 自動將上次的每組重量與次數填入輸入框
      last.sets.forEach((set, idx) => {
        addSetRow(set.weight, set.reps);
      });
      // 若上次不足 3 組，補足至預設 3 組
      while (container.children.length < 3) {
        addSetRow('', '');
      }
    } else {
      prevBox.innerHTML = `<span style="color:var(--text-muted);">無歷史紀錄 (新動作)</span>`;
      document.getElementById('noteInput').value = '';
      // 預設給予 3 組空白輸入框 (共 6 個 text box)
      addSetRow('', '');
      addSetRow('', '');
      addSetRow('', '');
    }
  }

  // 4. 動態增加 Set Row (重量 + 次數)
  function addSetRow(defaultWeight = '', defaultReps = '') {
    const container = document.getElementById('setsContainer');
    const setIndex = container.children.length + 1;

    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `
      <div class="set-tag">S${setIndex}</div>
      <input type="number" step="any" class="num-input set-weight" placeholder="lbs" value="${defaultWeight}">
      <input type="number" class="num-input set-reps" placeholder="次" value="${defaultReps}">
      <button class="btn-del-set" onclick="delSetRow(this)">✕</button>
    `;
    container.appendChild(row);
  }

  function delSetRow(btn) {
    const container = document.getElementById('setsContainer');
    if (container.children.length <= 1) {
      alert('至少需保留 1 組！');
      return;
    }
    btn.parentElement.remove();
    // 重新排序 S1, S2, S3 標籤
    Array.from(container.children).forEach((row, idx) => {
      row.querySelector('.set-tag').textContent = `S${idx + 1}`;
    });
  }

  // 5. 儲存動作 (離線 LocalStorage)
  function saveExerciseRecord() {
    const date = dateInput.value;
    const note = document.getElementById('noteInput').value.trim();
    const rows = document.querySelectorAll('#setsContainer .set-row');

    const sets = [];
    rows.forEach(r => {
      const w = parseFloat(r.querySelector('.set-weight').value);
      const rep = parseInt(r.querySelector('.set-reps').value);
      if (!isNaN(w) && !isNaN(rep)) {
        sets.push({ weight: w, reps: rep });
      }
    });

    if (sets.length === 0) {
      alert('請至少填寫一組完整的重量與次數！');
      return;
    }

    // 自動組裝成你習慣的文字格式 (例: 135lbs 6 120lbs 8,8)
    const formatted = formatSetsToText(sets, note);

    const record = {
      id: Date.now(),
      date: date,
      name: selectedExercise,
      category: currentCategory,
      sets: sets,
      note: note,
      formatted: formatted
    };

    db.push(record);
    localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));

    renderTodayList();
    selectExercise(selectedExercise); // 刷新上次看板
    alert(`✅ 已儲存 ${selectedExercise}！`);
  }

  // 輔助：格式化為對話框格式
  function formatSetsToText(sets, note) {
    // 將同重量的 reps 合併 (例: 120lbs 8,8)
    let parts = [];
    let curWeight = null;
    let curReps = [];

    sets.forEach(s => {
      if (s.weight === curWeight) {
        curReps.push(s.reps);
      } else {
        if (curWeight !== null) {
          parts.push(`${curWeight}lbs ${curReps.join(',')}`);
        }
        curWeight = s.weight;
        curReps = [s.reps];
      }
    });
    if (curWeight !== null) {
      parts.push(`${curWeight}lbs ${curReps.join(',')}`);
    }

    let res = parts.join(' ');
    if (note) res += ` ${note}`;
    return res;
  }

  // 6. 渲染今日清單
  function renderTodayList() {
    const curDate = dateInput.value;
    const listEl = document.getElementById('todayList');
    const items = db.filter(item => item.date === curDate);

    if (items.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:12px;">今日仲未有記錄</div>';
      return;
    }

    listEl.innerHTML = items.map(item => `
      <div class="log-item">
        <div class="log-head">
          <span class="log-title">${item.name}</span>
          <button style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:0.75rem;" onclick="deleteRecord(${item.id})">刪除</button>
        </div>
        <div class="log-body">${item.formatted}</div>
      </div>
    `).join('');
  }

  function deleteRecord(id) {
    if (confirm('確定刪除此動作記錄？')) {
      db = db.filter(item => item.id !== id);
      localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));
      renderTodayList();
      renderHistory();
    }
  }

  // 一鍵複製今日對話格式
  function copyTodayFormatted() {
    const curDate = dateInput.value;
    const items = db.filter(item => item.date === curDate);
    if (items.length === 0) {
      alert('今日無任何記錄！');
      return;
    }
    const d = new Date(curDate);
    let out = `${d.getDate()}/${d.getMonth() + 1}\n`;
    items.forEach(item => {
      out += `${item.name} ${item.formatted}\n`;
    });
    navigator.clipboard.writeText(out.trim()).then(() => {
      alert('已成功複製今日 Gym 紀錄！');
    });
  }

  // 7. TAB 2: 之前記錄 (按日期分組)
  function renderHistory() {
    const listEl = document.getElementById('historyList');
    if (db.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:20px;">暫無任何歷史記錄</div>';
      return;
    }

    // 按日期由新至舊分組
    const groups = {};
    db.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
      if (!groups[item.date]) groups[item.date] = [];
      groups[item.date].push(item);
    });

    listEl.innerHTML = Object.keys(groups).map(date => {
      const items = groups[date];
      const itemsHtml = items.map(it => `
        <div style="margin-top:6px; font-size:0.8rem;">
          <span style="color:var(--accent); font-weight:700;">${it.name}</span>: 
          <span style="font-family:monospace;">${it.formatted}</span>
        </div>
      `).join('');

      return `
        <div class="log-item" style="margin-bottom:12px;">
          <div class="log-head" style="border-bottom:1px solid var(--border); padding-bottom:6px;">
            <span style="font-weight:800; color:#fff;">📅 ${date}</span>
            <span style="font-size:0.7rem; color:var(--text-muted);">${items.length} 個動作</span>
          </div>
          ${itemsHtml}
        </div>
      `;
    }).join('');
  }

  // 8. TAB 3: 分析數據 (1RM 與進度)
  function populateAnalyticsDropdown() {
    const sel = document.getElementById('analyticsExSelect');
    const existingExercises = [...new Set(db.map(i => i.name))];
    
    if (existingExercises.length === 0) {
      sel.innerHTML = '<option>暫無數據</option>';
      return;
    }
    sel.innerHTML = existingExercises.map(e => `<option value="${e}">${e}</option>`).join('');
    renderAnalytics();
  }

  function renderAnalytics() {
    const exName = document.getElementById('analyticsExSelect').value;
    const timelineEl = document.getElementById('analyticsTimeline');
    if (!exName || exName === '暫無數據') {
      timelineEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:10px;">請先有記錄數據</div>';
      return;
    }

    const records = db.filter(i => i.name === exName).sort((a, b) => new Date(b.date) - new Date(a.date));

    let maxWeight = 0;
    let max1RM = 0;

    const timelineHtml = records.map(rec => {
      // 計算該次訓練的最佳 1RM = Weight * (1 + Reps/30)
      let bestSet1RM = 0;
      let topWeight = 0;

      rec.sets.forEach(s => {
        if (s.weight > topWeight) topWeight = s.weight;
        const e1rm = s.weight * (1 + s.reps / 30);
        if (e1rm > bestSet1RM) bestSet1RM = e1rm;
      });

      if (topWeight > maxWeight) maxWeight = topWeight;
      if (bestSet1RM > max1RM) max1RM = bestSet1RM;

      return `
        <div class="history-row">
          <div>
            <div style="font-weight:700; color:#fff;">${rec.date}</div>
            <div style="color:var(--text-muted); font-size:0.72rem; font-family:monospace;">${rec.formatted}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; color:var(--accent); font-family:monospace;">${Math.round(bestSet1RM)} lbs</div>
            <div style="font-size:0.65rem; color:var(--text-muted);">預估 1RM</div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('statMaxWeight').textContent = maxWeight || '--';
    document.getElementById('statMax1RM').textContent = Math.round(max1RM) || '--';
    timelineEl.innerHTML = timelineHtml;
  }

  // 9. 備份與匯出 / 匯入 JSON
  function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `gym_backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function importJSON() {
    const text = document.getElementById('backupTextarea').value.trim();
    if (!text) {
      alert('請先貼上 JSON 備份內容！');
      return;
    }
    try {
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) {
        db = parsed;
        localStorage.setItem('GYM_LOG_DB_V2', JSON.stringify(db));
        alert(`成功匯入 ${db.length} 條動作紀錄！`);
        toggleModal('backupModal');
        selectExercise(selectedExercise);
        renderHistory();
      } else {
        alert('格式錯誤：必須是 JSON Array！');
      }
    } catch (e) {
      alert('解析失敗，請確認 JSON 是否合法！');
    }
  }

  function toggleModal(id) {
    const m = document.getElementById(id);
    m.classList.toggle('active');
    if (m.classList.contains('active')) {
      document.getElementById('backupTextarea').value = JSON.stringify(db, null, 2);
    }
  }

  // 啟動初始化
  filterCat('胸');
  selectExercise('Chest press');
  renderTodayList();
</script>
</body>
</html>
